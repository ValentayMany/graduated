<!DOCTYPE html>
<html lang="lo">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ຂໍ້ຄວາມພິເສດສຳລັບຈອມຂວັນ 💌</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Noto+Sans+Lao+Looped:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <div class="bg" id="bg"></div>
  <dialog class="occasion-dialog" id="occasionDialog" aria-labelledby="occasionTitle" aria-describedby="occasionHint">
    <h2 id="occasionTitle">💌 ເລືອກຄຳອວຍພອນ</h2>
    <p id="occasionHint">ເລືອກເລື່ອງພິເສດສຳລັບຈອມຂວັນ</p>
    <div class="occasion-options">
      <button type="button" data-occasion="graduation">🎓 ຍິນດີນຳບັນດິດໃໝ່</button>
      <button type="button" data-occasion="birthday">🎂 ສຸກສັນວັນເກີດ</button>
    </div>
  </dialog>
  <div class="wrap">

    <div id="intro">
      <p class="tease" data-k="tease"></p>
      <p class="hint" data-k="hint"></p>
      <div class="gift">
        <div class="box"></div>
        <div class="rib"></div>
        <div class="lid"></div>
        <div class="bear">🧸</div>
        <div class="bow">🎀</div>
      </div>
    </div>

    <div id="counter" class="hide">
      <div class="count" id="num">3</div>
    </div>

    <div id="reveal" class="hide">
      <div class="top" id="topIcon">🎂</div>
      <h1><span data-k="t1"></span><br><span data-k="t2"></span></h1>
      <div class="name" data-k="name"></div>
      <p class="sub" data-k="sub"></p>

      <div class="pcards">
        <div class="pcard"><img
            src="assets/images/photo-01.jpg"
            alt=""></div>
        <div class="pcard"><img
            src="assets/images/photo-02.jpg"
            alt=""></div>
        <div class="pcard"><img
            src="assets/images/photo-03.jpg"
            alt="">
          <small data-k="cap"></small>
        </div>
      </div>

      <div class="letter">
        <p data-k="letter"></p>
      </div>

      <h2 data-k="h2"></h2>
      <div class="notes">
        <div class="note" data-k="w1"></div>
        <div class="note" data-k="w2"></div>
        <div class="note" data-k="w3"></div>
      </div>

      <button id="again" data-k="btn"></button>
      <div class="from" data-k="from"></div>
    </div>

    <button class="message-trigger hide" id="messageOpen" type="button" aria-haspopup="dialog" aria-controls="messageDialog">💌 ກົດເບິ່ງຂໍ້ຄວາມພິເສດ</button>
    <dialog class="message-dialog" id="messageDialog" aria-label="ຂໍ້ຄວາມພິເສດ">
      <button class="message-close" id="messageClose" type="button" aria-label="ປິດ">×</button>
      <p id="specialMessage"></p>
    </dialog>
  </div>

  <script src="assets/js/app.js" defer></script>
</body>

</html>
